publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  barcode_widget: ^2.0.4
  csv: ^8.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  image_picker: ^1.2.4
  intl: ^0.20.3
